<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="subject-info" data-id="kst" data-name="KST" />

    <title>Ôn tập KST</title>

    <link rel="stylesheet" href="kst_style.css" />
  </head>
  <body>
    <a href="../../index.html" class="back-to-hall-btn">❮ Quay về (Chọn môn)</a>

    <div class="music-control">
      <audio id="bg-music" src="" loop></audio>
      <label for="music-select">Chọn Nhạc Nền:</label>
      <select id="music-select">
        <option value="none">-- Tắt Nhạc --</option>
        <option value="../../assets/tien-quan-ca.mp3" selected>
          Tiến Quân Ca
        </option>
        <option value="../../assets/viet-tiep-cau-chuyen-hoa-binh.mp3">
          Viết tiếp câu chuyện hoà bình
        </option>
      </select>
      <button id="music-toggle-btn">Bật Nhạc 🎵</button>
    </div>

    <div id="menu-container" class="container active">
      <h1 id="subject-title">ÔN TẬP KST</h1>
      <div class="theme-selector-box">
        <label for="theme-select">🎨 Chọn Chủ đề:</label>
        <select id="theme-select">
          <option value="kst-purple">KST (Mặc định)</option>
          <option value="dark">Chế độ Tối</option>
          <option value="cyan">Xanh Lơ</option>
        </select>
      </div>
      <button class="btn" id="start-set-menu-btn">
        Ôn theo đề (Tuần tự/Ngẫu nhiên)
      </button>
      <button class="btn" id="start-random-btn">Ôn ngẫu nhiên (chọn đề)</button>
      <button class="btn" id="preview-menu-btn">Xem trước đề</button>
      <button
        class="btn"
        id="manage-data-btn"
        style="background-color: #ffc107; color: #333"
      >
        Xem các điều chỉnh
      </button>
    </div>

    <div id="deck-select-container" class="container">
      <h2 id="deck-select-title">Chọn đề</h2>
      <div id="deck-list-buttons"></div>
      <button
        class="btn back-to-menu"
        id="back-to-menu-deck-select"
        style="background-color: #6c757d"
      >
        Về Menu
      </button>
    </div>

    <div id="random-deck-select-container" class="container">
      <h2 id="random-deck-select-title">Chọn các đề để ôn ngẫu nhiên</h2>
      <div id="random-deck-list-checkboxes"></div>
      <div class="option-toggle">
        <label>
          <input type="checkbox" id="toggle-shuffle-options-random" />
          Đảo nội dung đáp án
        </label>
      </div>
      <button class="btn" id="start-random-selected-btn">
        Bắt đầu ôn (các đề đã chọn)
      </button>
      <button
        class="btn back-to-menu"
        id="back-to-menu-random-select"
        style="background-color: #6c757d"
      >
        Về Menu
      </button>
    </div>

    <div id="mode-select-container" class="container">
      <h2 id="mode-select-title">Chọn Chế độ cho Đề...</h2>
      <button class="btn" id="start-sequential-btn">Câu hỏi theo thứ tự</button>
      <button class="btn" id="start-deck-random-btn">
        Câu hỏi đảo ngẫu nhiên
      </button>
      <div class="option-toggle">
        <label>
          <input type="checkbox" id="toggle-shuffle-options-deck" />
          Đảo nội dung đáp án
        </label>
      </div>
      <button
        class="btn"
        id="back-to-deck-select"
        style="background-color: #6c757d"
      >
        Quay lại chọn Đề
      </button>
    </div>

    <div id="quiz-container" class="container">
      <div id="question-header">
        <span id="question-counter">Câu 1/50</span>
        <button id="edit-question-btn" class="icon-btn" title="Sửa câu hỏi này">
          ⚙️
        </button>
      </div>
      <div id="question-text">Đây là nội dung câu hỏi?</div>
      <div id="options-container"></div>
      <div id="feedback-text"></div>
      <button class="btn" id="next-btn">Câu tiếp theo</button>
      <button
        class="btn back-to-menu"
        id="back-to-menu-quiz"
        style="background-color: #6c757d"
      >
        Về Menu
      </button>
    </div>

    <div id="result-container" class="container">
      <h2>Hoàn thành!</h2>
      <p>Kết quả của bạn:</p>
      <p id="score-text">Đúng: 0 / Sai: 0</p>
      <button class="btn back-to-menu" id="back-to-menu-result">
        Về Menu chính
      </button>
    </div>

    <div id="preview-container" class="container">
      <h2 id="preview-deck-title">Xem trước đề...</h2>
      <div id="preview-content"></div>
      <button class="btn back-to-menu" id="back-to-menu-preview">
        Về Menu
      </button>
    </div>

    <div id="manage-data-container" class="container">
      <h2>Quản lý các điều chỉnh (Môn KST)</h2>
      <div class="manage-tabs">
        <button class="tab-btn active" data-tab="edited">Câu đã sửa</button>
        <button class="tab-btn" data-tab="ignored">
          Câu đã ẩn (Không học)
        </button>
      </div>
      <div id="manage-content-edited" class="tab-content active"></div>
      <div id="manage-content-ignored" class="tab-content"></div>
      <button
        class="btn"
        id="reset-all-data-btn"
        style="background-color: #dc3545"
      >
        Reset toàn bộ môn học
      </button>
      <button
        class="btn back-to-menu"
        id="back-to-menu-manage"
        style="background-color: #6c757d"
      >
        Về Menu
      </button>
    </div>

    <div id="edit-modal-backdrop" class="modal-backdrop">
      <div id="edit-modal" class="modal-content">
        <h3>Chỉnh sửa câu hỏi</h3>
        <p><strong>ID Câu hỏi:</strong> <span id="modal-question-id"></span></p>
        <div class="form-group">
          <label for="modal-question-text">Câu hỏi:</label>
          <textarea id="modal-question-text" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Các lựa chọn:</label>
          <input
            type="text"
            id="modal-option-A"
            placeholder="Nội dung đáp án A"
          />
          <input
            type="text"
            id="modal-option-B"
            placeholder="Nội dung đáp án B"
          />
          <input
            type="text"
            id="modal-option-C"
            placeholder="Nội dung đáp án C"
          />
          <input
            type="text"
            id="modal-option-D"
            placeholder="Nội dung đáp án D"
          />
          <input
            type="text"
            id="modal-option-E"
            placeholder="Nội dung đáp án E (Nếu có)"
          />
        </div>
        <div class="form-group">
          <label for="modal-correct-answer">Đáp án đúng:</label>
          <select id="modal-correct-answer">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
          </select>
        </div>
        <div class="form-group">
          <label for="modal-explanation-text">Giải thích:</label>
          <textarea id="modal-explanation-text" rows="2"></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn" id="modal-save-btn">Lưu thay đổi</button>
          <button
            class="btn"
            id="modal-ignore-btn"
            style="background-color: #ffc107; color: #333"
          >
            Không học câu này
          </button>
          <button
            class="btn"
            id="modal-cancel-btn"
            style="background-color: #6c757d"
          >
            Hủy
          </button>
        </div>
      </div>
    </div>

    <script src="data/kst_data.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script src="../../game_logic.js"></script>
  </body>
</html>
